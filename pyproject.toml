[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-jit-test-suite"
version = "0.2.0"
description = "Deterministic + fuzz + hand-crafted stress test suite targeting Python 3.16 JIT correctness/perf"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "axiomzero0" }]
keywords = ["jit", "compiler", "testing", "fuzzing", "differential-testing", "python", "python3.16"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # stdlib-only by default; optional deps below
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.100",
    "rich>=13.0",
]
perf = [
    "psutil>=5.9",
]

[project.scripts]
jit-suite = "jit_tests.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jit_tests = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestCollectionWarning",
]
python_classes = "Test*Spec"
